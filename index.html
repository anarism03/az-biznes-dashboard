<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="AzərDash — biznesdə qərarvermə üçün interaktiv vizual analitika: rəsmi makro göstəricilər, Dünya Bankı məlumatları və sorğu nəticələri."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#e6edf1" />
    <title>AzərDash — Qərar üçün vizual analitika</title>
    <script>
      // Tema ilk boyamadan əvvəl tətbiq olunur ki, ekran yanıb-sönməsin
      try {
        var t = localStorage.getItem('az_dash_theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
